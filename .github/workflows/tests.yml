name: tests
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: nrg1c3/nrg1c3.github.io, path: site }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium && sudo apt-get install -y xvfb
      - run: SITE_REPO="$GITHUB_WORKSPACE/site" bash tests/run.sh
